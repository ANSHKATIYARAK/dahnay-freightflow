# Mediterranean Shipping Company (MSC) Bill of Lading Template
# Compliant with invoice2data & DCSA eBL standards
issuer: Mediterranean Shipping Company (MSC)
keywords:
  - MSC
  - MEDITERRANEAN SHIPPING COMPANY
  - BILL OF LADING

fields:
  booking_reference: (?:Booking No|B/L No)[\s:]+([A-Z0-9\-]+)
  shipper_name: Shipper[\s:]+([^\n\r]+)
  consignee_name: Consignee[\s:]+([^\n\r]+)
  vessel_name: Vessel[\s:]+([A-Z\s]+?)(?:\s+Voyage|\n)
  voyage_number: Voyage[\s:]+([0-9A-Z]+)
  port_of_loading: Port of Loading[\s:]+([^\n\r]+)
  port_of_discharge: Port of Discharge[\s:]+([^\n\r]+)
  total_gross_weight_kg: Gross Cargo Weight[\s:]+([0-9,.]+)\s*(?:KGS|KG)?
  total_packages: Total Packages[\s:]+([0-9]+)
  cargo_description: Description of Goods[\s:]+([^\n\r]+)
