version: '3.8'

services:
  dahnay-freightflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dahnay_freightflow_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - CARGOWISE_SERVER=PROD_IN
      - CARGOWISE_BRANCH=CHENNAI_MAA
    volumes:
      - ./dahnay_logistics/data:/app/dahnay_logistics/data
    restart: always
